<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">雙通道比較：高低分組的年化報酬差</title><desc id="svgdesc">相同資料與 W20H5 設定｜各三次獨立訓練彙整平均｜論文表 4-3。數據來源是研究者 2026 年碩士論文，屬歷史樣本外回測指標，不代表真實投資績效。</desc><rect x="0" y="0" width="1200" height="560" rx="0" fill="#f8fafc"/><text x="60" y="64" fill="#112d46" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="31" font-weight="700" text-anchor="start">雙通道比較：高低分組的年化報酬差</text><text x="60" y="101" fill="#64758a" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">相同資料與 W20H5 設定｜各三次獨立訓練彙整平均｜論文表 4-3</text><line x1="334" y1="151" x2="334" y2="379" stroke="#dce4ec" stroke-width="1.5" stroke-dasharray="5 6"/><text x="334" y="419" fill="#65768a" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">0%</text><line x1="529" y1="151" x2="529" y2="379" stroke="#dce4ec" stroke-width="1.5" stroke-dasharray="5 6"/><text x="529" y="419" fill="#65768a" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">20%</text><line x1="724" y1="151" x2="724" y2="379" stroke="#dce4ec" stroke-width="1.5" stroke-dasharray="5 6"/><text x="724" y="419" fill="#65768a" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">40%</text><line x1="919" y1="151" x2="919" y2="379" stroke="#dce4ec" stroke-width="1.5" stroke-dasharray="5 6"/><text x="919" y="419" fill="#65768a" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">60%</text><line x1="1114" y1="151" x2="1114" y2="379" stroke="#dce4ec" stroke-width="1.5" stroke-dasharray="5 6"/><text x="1114" y="419" fill="#65768a" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">80%</text><text x="60" y="222" fill="#1a344b" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">價格圖像基準</text><rect x="334" y="178" width="564.525" height="65" rx="9" fill="#2b5678"/><text x="880.525" y="222" fill="#ffffff" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="23" font-weight="700" text-anchor="end">57.90%</text><text x="60" y="337" fill="#1a344b" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">新增每日報酬通道</text><rect x="334" y="293" width="722.28" height="65" rx="9" fill="#4f99c8"/><text x="1038.28" y="337" fill="#ffffff" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="23" font-weight="700" text-anchor="end">74.08%</text><text x="60" y="468" fill="#114d72" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="23" font-weight="750" text-anchor="start">兩組結果相差 16.18 個百分點；不表示實際投資會多賺 16.18%。</text><line x1="60" y1="491" x2="1140" y2="491" stroke="#d5e2ec"/><text x="60" y="519" fill="#64758a" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">研究型歷史回測，不等於真實獲利；尚未完成完整成本與顯著性檢定。</text><text x="1140" y="546" fill="#7c8da1" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="13" font-weight="400" text-anchor="end">依正式論文圖 4-2 數值重繪</text></svg>