<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">雙通道比較：高低分組的夏普比率</title><desc id="svgdesc">同一組 W20H5 受控比較｜論文表 4-3。數據來源是研究者 2026 年碩士論文，屬歷史樣本外回測指標，不代表真實投資績效。</desc><rect x="0" y="0" width="1200" height="560" rx="0" fill="#f8fafc"/><text x="60" y="64" fill="#112d46" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="31" font-weight="700" text-anchor="start">雙通道比較：高低分組的夏普比率</text><text x="60" y="101" fill="#64758a" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">同一組 W20H5 受控比較｜論文表 4-3</text><line x1="334" y1="151" x2="334" y2="379" stroke="#dce4ec" stroke-width="1.5" stroke-dasharray="5 6"/><text x="334" y="419" fill="#65768a" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">0.00</text><line x1="529" y1="151" x2="529" y2="379" stroke="#dce4ec" stroke-width="1.5" stroke-dasharray="5 6"/><text x="529" y="419" fill="#65768a" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">1.75</text><line x1="724" y1="151" x2="724" y2="379" stroke="#dce4ec" stroke-width="1.5" stroke-dasharray="5 6"/><text x="724" y="419" fill="#65768a" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">3.50</text><line x1="919" y1="151" x2="919" y2="379" stroke="#dce4ec" stroke-width="1.5" stroke-dasharray="5 6"/><text x="919" y="419" fill="#65768a" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">5.25</text><line x1="1114" y1="151" x2="1114" y2="379" stroke="#dce4ec" stroke-width="1.5" stroke-dasharray="5 6"/><text x="1114" y="419" fill="#65768a" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">7.00</text><text x="60" y="222" fill="#1a344b" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">價格圖像基準</text><rect x="334" y="178" width="629.5714285714286" height="65" rx="9" fill="#2b5678"/><text x="945.5714285714286" y="222" fill="#ffffff" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="23" font-weight="700" text-anchor="end">5.65</text><text x="60" y="337" fill="#1a344b" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">新增每日報酬通道</text><rect x="334" y="293" width="706.4571428571428" height="65" rx="9" fill="#4f99c8"/><text x="1022.4571428571428" y="337" fill="#ffffff" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="23" font-weight="700" text-anchor="end">6.34</text><text x="60" y="468" fill="#114d72" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="23" font-weight="750" text-anchor="start">加入每日報酬通道後，夏普比率由 5.65 變為 6.34。</text><line x1="60" y1="491" x2="1140" y2="491" stroke="#d5e2ec"/><text x="60" y="519" fill="#64758a" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">夏普比率是風險調整後的歷史指標，不是報酬率或獲利保證。</text><text x="1140" y="546" fill="#7c8da1" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="13" font-weight="400" text-anchor="end">依正式論文圖 4-3 數值重繪</text></svg>