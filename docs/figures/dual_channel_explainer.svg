<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title description"><title id="title">雙通道價格圖像概念示意</title><desc id="description">使用同一段過去20個交易日數值，第一通道描繪開盤、最高、最低、收盤、移動平均與成交量，第二通道獨立呈現每日單日漲跌幅；兩通道按日期對齊，再共同輸入卷積神經網路。圖中資料是人工示意，非真實股票，非論文正式輸入圖片。</desc><rect x="0" y="0" width="1200" height="710" rx="0" fill="#f8fafc" stroke="none"/><text x="54" y="62" fill="#0f2740" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">雙通道價格圖像：讓電腦從兩種視角看同一段走勢</text><text x="54" y="96" fill="#5a6c80" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">概念示意圖（合成資料）｜正式論文使用黑白 64 × 60 像素圖像</text><rect x="54" y="117" width="908" height="285" rx="16" fill="#111b28" stroke="none"/><text x="80" y="150" fill="#e8f2fc" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">第一通道　完整價量圖像</text><text x="80" y="175" fill="#a4b7ce" font-family="'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">開盤、最高、最低、收盤、移動平均線、成交量</text><line x1="93" y1="258.9" x2="902" y2="258.9" stroke="#3a4a5c" stroke-width="1" stroke-dasharray="3 6"/><line x1="93" y1="224.10000000000002" x2="902" y2="224.10000000000002" stroke="#3a4a5c" stroke-width="1" stroke-dasharray="3 6"/><line x1="93" y1="189.3" x2="902" y2="189.3" stroke="#3a4a5c" stroke-width="1" stroke-dasharray="3 6"/><line x1="93" y1="154.5" x2="902" y2="154.5" stroke="#3a4a5c" stroke-width="1" stroke-dasharray="3 6"/><line x1="120" y1="243.2" x2="120" y2="260.6" stroke="#f7fbff" stroke-width="2.6" stroke-linecap="round"/><line x1="113" y1="254.6" x2="120" y2="254.6" stroke="#f7fbff" stroke-width="2.6"/><line x1="120" y1="250.2" x2="127" y2="250.2" stroke="#f7fbff" stroke-width="2.6"/><rect x="115" y="310.6216216216216" width="10" height="13.37837